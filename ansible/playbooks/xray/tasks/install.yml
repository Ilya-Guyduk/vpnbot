---
- name: Get latest xray version from GitHub
  ansible.builtin.uri:
    url: https://api.github.com/repos/XTLS/Xray-core/releases/latest
    return_content: true
    headers:
      Accept: "application/vnd.github.v3+json"
  register: xray_latest_release
  when: xray_version == "latest"

- name: Set xray version fact
  ansible.builtin.set_fact:
    xray_resolved_version: >-
      {{
        xray_latest_release.json.tag_name
        if xray_version == 'latest'
        else ('v' + xray_version if not xray_version.startswith('v') else xray_version)
      }}

- name: Check if xray is already installed
  ansible.builtin.stat:
    path: "{{ xray_install_dir }}/xray"
  register: xray_binary

- name: Get installed xray version
  ansible.builtin.command: "{{ xray_install_dir }}/xray version"
  register: xray_installed_version
  changed_when: false
  failed_when: false
  when: xray_binary.stat.exists

- name: Determine architecture
  ansible.builtin.set_fact:
    xray_arch: >-
      {{
        'arm64-v8a' if ansible_architecture == 'aarch64'
        else ('arm32-v7a' if ansible_architecture == 'armv7l'
        else 'linux-64')
      }}

- name: Set needs_install fact
  ansible.builtin.set_fact:
    xray_needs_install: >-
      {{
        not xray_binary.stat.exists or
        xray_resolved_version not in (xray_installed_version.stdout | default(''))
      }}

- name: Download xray archive
  ansible.builtin.get_url:
    url: "https://github.com/XTLS/Xray-core/releases/download/{{ xray_resolved_version }}/Xray-{{ xray_arch }}.zip"
    dest: "/tmp/xray-{{ xray_resolved_version }}.zip"
    mode: '0644'
    timeout: 120
  when: xray_needs_install | bool

- name: Create unpack directory
  ansible.builtin.file:
    path: /tmp/xray-unpack
    state: directory
    mode: '0755'
  when: xray_needs_install | bool

- name: Unpack xray (via unzip binary)
  ansible.builtin.unarchive:
    src: "/tmp/xray-{{ xray_resolved_version }}.zip"
    dest: /tmp/xray-unpack/
    remote_src: true
  when:
    - xray_needs_install | bool
    - not (xray_use_python_unzip | default(false)) | bool
  ignore_errors: true
  register: unzip_result

- name: Unpack xray (via Python fallback)
  ansible.builtin.shell: |
    python3 -c "
    import zipfile
    with zipfile.ZipFile('/tmp/xray-{{ xray_resolved_version }}.zip') as z:
        z.extractall('/tmp/xray-unpack/')
    "
  when: >
    xray_needs_install | bool and
    ((xray_use_python_unzip | default(false)) | bool or
     (unzip_result is defined and unzip_result.failed | default(false)))

- name: Make xray binary executable
  ansible.builtin.file:
    path: /tmp/xray-unpack/xray
    mode: '0755'
  when: xray_needs_install | bool

- name: Install xray binary
  ansible.builtin.copy:
    src: /tmp/xray-unpack/xray
    dest: "{{ xray_install_dir }}/xray"
    owner: root
    group: root
    mode: '0755'
    remote_src: true
  when: xray_needs_install | bool
  notify: restart xray

# xray ищет geoip.dat / geosite.dat рядом с бинарником ИЛИ в xray_config_dir
# Кладём в config_dir и делаем симлинки рядом с бинарником — работает в обоих случаях
- name: Install geoip and geosite databases to config dir
  ansible.builtin.copy:
    src: "/tmp/xray-unpack/{{ item }}"
    dest: "{{ xray_config_dir }}/{{ item }}"
    owner: root
    group: root
    mode: '0644'
    remote_src: true
  loop:
    - geoip.dat
    - geosite.dat
  failed_when: false

- name: Symlink geo databases next to binary (xray looks here by default)
  ansible.builtin.file:
    src: "{{ xray_config_dir }}/{{ item }}"
    dest: "{{ xray_install_dir }}/{{ item }}"
    state: link
    force: true
  loop:
    - geoip.dat
    - geosite.dat
  failed_when: false

- name: Cleanup temp files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "/tmp/xray-{{ xray_resolved_version }}.zip"
    - /tmp/xray-unpack
  changed_when: false
