---
# ============================================================
#  TCP-туннель через bore.pub для тестирования за NAT
#  Пробрасывает порт xray наружу без изменения конфига
#  ТОЛЬКО для тестирования — на проде не нужно
# ============================================================

- name: Determine architecture for bore
  ansible.builtin.set_fact:
    bore_arch: >-
      {{
        'aarch64-unknown-linux-musl' if ansible_architecture == 'aarch64'
        else 'x86_64-unknown-linux-musl'
      }}

- name: Check if bore is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/bore
  register: bore_binary

- name: Get latest bore version
  ansible.builtin.uri:
    url: https://api.github.com/repos/ekzhang/bore/releases/latest
    return_content: true
  register: bore_latest
  when: not bore_binary.stat.exists

- name: Download bore binary
  ansible.builtin.get_url:
    url: "https://github.com/ekzhang/bore/releases/download/\
          {{ bore_latest.json.tag_name }}/\
          bore-{{ bore_latest.json.tag_name }}-{{ bore_arch }}.tar.gz"
    dest: /tmp/bore.tar.gz
    mode: '0644'
    timeout: 60
  when: not bore_binary.stat.exists

- name: Extract bore binary
  ansible.builtin.shell: |
    tar -xzf /tmp/bore.tar.gz -C /usr/local/bin/ bore
    chmod +x /usr/local/bin/bore
    rm -f /tmp/bore.tar.gz
  when: not bore_binary.stat.exists

# Если порт изменился в переменной — обновляем сервис и рестартуем
- name: Deploy bore systemd service
  ansible.builtin.template:
    src: bore.service.j2
    dest: /etc/systemd/system/bore-tunnel.service
    owner: root
    group: root
    mode: '0644'
  register: bore_service_deployed

- name: Restart bore if service config changed
  ansible.builtin.systemd:
    name: bore-tunnel
    state: restarted
    daemon_reload: true
  when: bore_service_deployed.changed

- name: Enable and start bore tunnel
  ansible.builtin.systemd:
    name: bore-tunnel
    enabled: true
    state: started
    daemon_reload: true

- name: Wait for bore to establish tunnel
  ansible.builtin.pause:
    seconds: 5

- name: Get bore tunnel address from journal
  ansible.builtin.shell: |
    journalctl -u bore-tunnel -n 30 --no-pager 2>/dev/null \
      | grep -oP 'bore\.pub:\d+' | tail -1
  register: bore_address
  changed_when: false
  retries: 6
  delay: 3
  until: bore_address.stdout != ""

- name: Generate tunnel client URIs
  ansible.builtin.shell: |
    BORE_HOST=$(echo "{{ bore_address.stdout }}" | cut -d: -f1)
    BORE_PORT=$(echo "{{ bore_address.stdout }}" | cut -d: -f2)
    UUID="{{ item.uuid }}"
    NAME="{{ item.name }}"

    VLESS_URI="vless://${UUID}@${BORE_HOST}:${BORE_PORT}?encryption=none&flow={{ item.flow }}&security=reality&sni={{ xray_reality_server_name }}&fp={{ xray_fingerprint }}&pbk={{ _xray_public_key }}&sid={{ xray_short_ids[0] }}&type=tcp&headerType=none#{{ item.name | urlencode }}-tunnel"

    echo "${VLESS_URI}" > "{{ xray_qr_output_dir }}/${NAME}-tunnel.uri"
    echo "${VLESS_URI}" | qrencode -t ANSIUTF8 \
      > "{{ xray_qr_output_dir }}/${NAME}-tunnel_qr.txt" 2>/dev/null || true
    echo "${VLESS_URI}"
  args:
    executable: /bin/bash
  register: tunnel_uris
  loop: "{{ xray_resolved_clients }}"
  loop_control:
    label: "{{ item.name }}"
  changed_when: true

- name: Print tunnel connection info
  ansible.builtin.debug:
    msg: |
      ============================================================
       TUNNEL для тестирования за NAT
       Адрес туннеля: {{ bore_address.stdout }}
       Порт зафиксирован: {{ 'ДА (--port ' + xray_tunnel_port | string + ')' if xray_tunnel_port | int > 0 else 'НЕТ — укажи xray_tunnel_port чтобы зафиксировать' }}
      ============================================================
      {% for result in tunnel_uris.results %}
       Клиент: {{ result.item.name }}
       URI:    {{ result.stdout_lines[-1] }}
       QR:     {{ xray_qr_output_dir }}/{{ result.item.name }}-tunnel_qr.txt
      {% endfor %}
      ============================================================
      {% if xray_tunnel_port | int == 0 %}
      ВАЖНО: порт случайный и меняется при перезапуске сервиса!
      Задай xray_tunnel_port: <число> в inventory чтобы зафиксировать.
      {% else %}
      Порт {{ xray_tunnel_port }} постоянный — URI не устаревают.
      {% endif %}
      ============================================================
