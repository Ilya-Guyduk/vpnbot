---
# ============================================================
#  TCP BBR + сетевая оптимизация
#  BBR значительно улучшает throughput на высоко-задержечных каналах
# ============================================================

- name: Check current kernel version
  ansible.builtin.command: uname -r
  register: kernel_version
  changed_when: false

- name: Enable BBR module
  ansible.builtin.modprobe:
    name: tcp_bbr
    state: present
  ignore_errors: true   # в некоторых контейнерах недоступно
  register: bbr_module

- name: Configure sysctl for xray / BBR
  ansible.posix.sysctl:
    name: "{{ item.key }}"
    value: "{{ item.value }}"
    state: present
    reload: false
    ignoreerrors: true   # контейнеры могут запрещать часть параметров
  loop:
    # BBR
    - { key: "net.core.default_qdisc",           value: "fq" }
    - { key: "net.ipv4.tcp_congestion_control",   value: "bbr" }
    # Буферы
    - { key: "net.core.rmem_max",                 value: "134217728" }
    - { key: "net.core.wmem_max",                 value: "134217728" }
    - { key: "net.core.netdev_max_backlog",        value: "250000" }
    - { key: "net.ipv4.tcp_rmem",                 value: "4096 87380 67108864" }
    - { key: "net.ipv4.tcp_wmem",                 value: "4096 65536 67108864" }
    # Устойчивость соединений
    - { key: "net.ipv4.tcp_fastopen",             value: "3" }
    - { key: "net.ipv4.tcp_slow_start_after_idle", value: "0" }
    - { key: "net.ipv4.tcp_tw_reuse",             value: "1" }
    - { key: "net.ipv4.ip_local_port_range",      value: "1024 65535" }
    # IP-форвардинг (нужен для tproxy/routing)
    - { key: "net.ipv4.ip_forward",               value: "1" }
  notify: apply sysctl

- name: Persist sysctl settings in file
  ansible.builtin.template:
    src: sysctl-xray.conf.j2
    dest: /etc/sysctl.d/99-xray.conf
    owner: root
    group: root
    mode: '0644'
  notify: apply sysctl
