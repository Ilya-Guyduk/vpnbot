---
# ============================================================
#  Xray-core | VLESS + Reality (наиболее устойчивая конфигурация)
# ============================================================

# --- Установка ---
xray_version: "latest"                  # или конкретная: "1.8.23"
xray_install_dir: /usr/local/bin
xray_config_dir: /usr/local/etc/xray
xray_log_dir: /var/log/xray

# --- Сеть ---
xray_port: 443                          # порт, под который маскируемся

# --- Reality (SNI camouflage) ---
# Цель должна поддерживать TLSv1.3 + H2 и НЕ быть заблокирована в стране клиента
xray_reality_dest: "www.microsoft.com:443"
xray_reality_server_name: "www.microsoft.com"

# Fingerprint TLS клиента (имитация браузера)
# Варианты: chrome | firefox | safari | ios | android | edge | 360 | qq | random | randomized
xray_fingerprint: "chrome"

# Short IDs — можно добавить несколько для разных клиентов
xray_short_ids:
  - ""               # пустой разрешён
  - "abcdef01"
  - "deadbeef"

# --- Ключи Reality (генерируются автоматически при первом запуске) ---
# Можно задать вручную, если нужна идемпотентность
xray_private_key: ""   # оставить пустым — роль сгенерирует сама
xray_public_key: ""

# --- Клиенты ---
# Список пользователей. UUID генерируется автоматически если не задан.
xray_clients:
  - name: "user1"
    uuid: ""           # оставить пустым — сгенерируется
    flow: "xtls-rprx-vision"   # ОБЯЗАТЕЛЬНО для Reality
    email: "user1@vpn"

# --- Системная оптимизация ---
xray_bbr_enabled: true           # TCP BBR congestion control
xray_sysctl_tuning: true         # оптимизация сетевых буферов

# --- Автообновление ---
xray_autoupdate_enabled: true
xray_autoupdate_schedule: "Mon *-*-* 03:00:00"  # systemd-timer: раз в неделю в 3 ночи

# --- QR-коды ---
xray_generate_qr: true
xray_qr_output_dir: /root/xray-clients

# --- Логирование ---
xray_log_level: "warning"        # none | error | warning | info | debug
xray_access_log: false           # отключить access log для приватности

# --- Туннель для тестирования за NAT ---
# Использует bore.pub — бесплатный TCP туннель без регистрации
# НЕ включать на проде
xray_tunnel_enabled: false
xray_tunnel_port: 0       # 0 = случайный (меняется при рестарте), задай конкретный чтобы зафиксировать
