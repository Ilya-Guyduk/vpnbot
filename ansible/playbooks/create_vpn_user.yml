---
# ============================================================
#  Создание VPN-клиента и запись конфига для Telegram-бота
#
#  Вызывается из bot/services/ansible.py:
#    ansible-playbook create_vpn_user.yml -i inventory.yml \
#      -e "user_id=123456789 duration_days=30 config_output_path=/tmp/vpn_configs/user_123456789.conf"
#
#  Результат: VLESS URI записывается в config_output_path
#  Бот читает файл, отправляет пользователю, удаляет файл.
# ============================================================

- name: Create VPN client for Telegram user
  hosts: vpn_servers
  become: true
  gather_facts: true

  vars:
    # ── Приходят из бота (обязательные) ──────────────────────────────────────
    user_id:             ""         # Telegram user_id
    duration_days:       30         # длительность подписки (информационно)
    config_output_path:  ""         # куда писать URI для бота

    # ── Производные (не менять) ───────────────────────────────────────────────
    client_name:  "tg_{{ user_id }}"
    client_email: "{{ user_id }}@tg.blacklist"

    # ── Пути xray роли ────────────────────────────────────────────────────────
    xray_config_backup:  "{{ xray_config_dir }}/config.json.backup"
    server_clients_file: "{{ xray_config_dir }}/clients.yml"

  pre_tasks:
    - name: Проверить обязательные переменные
      ansible.builtin.fail:
        msg: "Переменная '{{ item }}' не передана из бота!"
      when: vars[item] == ""
      loop:
        - user_id
        - config_output_path

    - name: Убедиться что директория для конфигов существует
      ansible.builtin.file:
        path: "{{ config_output_path | dirname }}"
        state: directory
        mode: '0700'
      delegate_to: localhost
      become: false

  tasks:

    # ── 1. Загрузить Reality-ключи ────────────────────────────────────────────

    - name: Загрузить Reality-ключи
      ansible.builtin.slurp:
        src: "{{ xray_config_dir }}/.reality_keys"
      register: reality_keys_raw

    - name: Распарсить Reality-ключи
      ansible.builtin.set_fact:
        _xray_private_key: "{{ (reality_keys_raw.content | b64decode).split('\n')
                              | select('match', 'private_key=') | first
                              | regex_replace('private_key=', '') }}"
        _xray_public_key: "{{ (reality_keys_raw.content | b64decode).split('\n')
                              | select('match', 'public_key=') | first
                              | regex_replace('public_key=', '') }}"

    # ── 2. Получить IP сервера ────────────────────────────────────────────────

    - name: Определить внешний IP сервера
      ansible.builtin.set_fact:
        server_ip: "{{ ansible_host }}"

    # ── 3. Сгенерировать UUID ─────────────────────────────────────────────────

    - name: Проверить — существует ли UUID для этого пользователя
      ansible.builtin.stat:
        path: "{{ xray_config_dir }}/.client_{{ client_name }}.uuid"
      register: uuid_file_stat

    - name: Сгенерировать новый UUID (только если нет существующего)
      ansible.builtin.command: "{{ xray_install_dir }}/xray uuid"
      register: new_uuid_raw
      changed_when: true
      when: not uuid_file_stat.stat.exists

    - name: Сохранить новый UUID на сервере
      ansible.builtin.copy:
        content: "{{ new_uuid_raw.stdout | trim }}"
        dest: "{{ xray_config_dir }}/.client_{{ client_name }}.uuid"
        owner: root
        group: root
        mode: '0600'
      when: not uuid_file_stat.stat.exists

    - name: Загрузить существующий UUID
      ansible.builtin.slurp:
        src: "{{ xray_config_dir }}/.client_{{ client_name }}.uuid"
      register: existing_uuid_raw

    - name: Установить UUID
      ansible.builtin.set_fact:
        client_uuid: "{{ existing_uuid_raw.content | b64decode | trim }}"

    # ── 4. Обновить список клиентов ───────────────────────────────────────────

    - name: Проверить файл клиентов
      ansible.builtin.stat:
        path: "{{ server_clients_file }}"
      register: clients_file_stat

    - name: Прочитать существующих клиентов
      ansible.builtin.slurp:
        src: "{{ server_clients_file }}"
      register: existing_clients_raw
      when: clients_file_stat.stat.exists

    - name: Установить пустой словарь если файла нет
      ansible.builtin.set_fact:
        server_clients: {}
      when: not clients_file_stat.stat.exists

    - name: Распарсить существующих клиентов
      ansible.builtin.set_fact:
        server_clients: "{{ existing_clients_raw.content | b64decode | from_yaml }}"
      when: clients_file_stat.stat.exists

    - name: Добавить/обновить клиента в словаре
      ansible.builtin.set_fact:
        updated_server_clients: "{{ server_clients | combine({
          client_name: {
            'uuid':         client_uuid,
            'flow':         'xtls-rprx-vision',
            'email':        client_email,
            'duration_days': duration_days | int,
            'added_at':     ansible_date_time.iso8601
          }
        }) }}"

    - name: Сохранить обновлённый список клиентов
      ansible.builtin.copy:
        content: "{{ updated_server_clients | to_nice_yaml }}"
        dest: "{{ server_clients_file }}"
        owner: root
        group: root
        mode: '0600'

    - name: Собрать список клиентов для xray
      ansible.builtin.set_fact:
        xray_clients: "{{ updated_server_clients | dict2items
                          | map(attribute='value')
                          | map('combine', {'name': item.key})
                          | list }}"
      loop: "{{ updated_server_clients | dict2items }}"
      loop_control:
        loop_var: item

    - name: Убрать дубликаты по uuid
      ansible.builtin.set_fact:
        xray_clients: "{{ xray_clients | unique(attribute='uuid') | list }}"

    # ── 5. Пересобрать и проверить конфиг xray ────────────────────────────────

    - name: Импортировать ключи роли
      ansible.builtin.import_role:
        name: xray
        tasks_from: keys.yml

    - name: Создать резервную копию конфига
      ansible.builtin.copy:
        src:  "{{ xray_config_dir }}/config.json"
        dest: "{{ xray_config_backup }}"
        remote_src: true
        owner: root
        group: root
        mode: '0600'
      ignore_errors: true

    - name: Регенерировать конфиг xray
      ansible.builtin.import_role:
        name: xray
        tasks_from: config.yml

    - name: Проверить новый конфиг
      ansible.builtin.command: "{{ xray_install_dir }}/xray -test -config {{ xray_config_dir }}/config.json"
      register: config_test
      changed_when: false
      failed_when: false

    # ── 6. Откат при ошибке ───────────────────────────────────────────────────

    - name: Откат — восстановить конфиг
      ansible.builtin.copy:
        src:  "{{ xray_config_backup }}"
        dest: "{{ xray_config_dir }}/config.json"
        remote_src: true
        owner: root
        group: root
        mode: '0644'
      when: config_test.rc != 0

    - name: Откат — восстановить список клиентов
      ansible.builtin.copy:
        content: "{{ server_clients | to_nice_yaml }}"
        dest: "{{ server_clients_file }}"
        owner: root
        group: root
        mode: '0600'
      when:
        - config_test.rc != 0
        - clients_file_stat.stat.exists

    - name: Откат — удалить файл клиентов если был новым
      ansible.builtin.file:
        path: "{{ server_clients_file }}"
        state: absent
      when:
        - config_test.rc != 0
        - not clients_file_stat.stat.exists

    - name: Откат — упасть с внятной ошибкой
      ansible.builtin.fail:
        msg: |
          Конфиг xray не прошёл проверку — изменения отменены.
          Ошибка: {{ config_test.stderr }}
      when: config_test.rc != 0

    # ── 7. Перезагрузить xray ─────────────────────────────────────────────────

    - name: Удалить резервную копию после успеха
      ansible.builtin.file:
        path: "{{ xray_config_backup }}"
        state: absent

    - name: Перезагрузить xray
      ansible.builtin.systemd:
        name: xray
        state: reloaded

    - name: Убедиться что xray запущен
      ansible.builtin.systemd:
        name: xray
        state: started
      register: xray_running

    # ── 8. Сгенерировать VLESS URI и записать для бота ────────────────────────

    - name: Собрать VLESS URI
      ansible.builtin.set_fact:
        # Формат: vless://<uuid>@<ip>:<port>?...#<label>
        vless_uri: >-
          vless://{{ client_uuid }}@{{ server_ip }}:{{ xray_port | default(443) }}
          ?security=reality
          &sni={{ xray_sni | default('www.microsoft.com') }}
          &fp={{ xray_fingerprint | default('chrome') }}
          &pbk={{ _xray_public_key }}
          &sid={{ xray_short_id | default('') }}
          &flow=xtls-rprx-vision
          &type=tcp
          #BlackList-{{ client_name }}

    - name: Нормализовать URI (убрать пробелы и переносы)
      ansible.builtin.set_fact:
        vless_uri: "{{ vless_uri | regex_replace('\\s+', '') }}"

    # ── Запись результата для бота (на localhost) ─────────────────────────────

    - name: Записать VLESS URI в config_output_path
      ansible.builtin.copy:
        content: "{{ vless_uri }}"
        dest: "{{ config_output_path }}"
        mode: '0600'
      delegate_to: localhost
      become: false

    - name: ✅ Клиент создан
      ansible.builtin.debug:
        msg:
          - "user_id:       {{ user_id }}"
          - "client_name:   {{ client_name }}"
          - "uuid:          {{ client_uuid }}"
          - "duration_days: {{ duration_days }}"
          - "URI записан в: {{ config_output_path }}"