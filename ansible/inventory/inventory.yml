---
# ============================================================
#  Inventory для Xray VPN серверов
#
#  Для теста в контейнере:
#    ansible-playbook -i inventory.yml site.yml -l test
#
#  Для прода:
#    ansible-playbook -i inventory.yml site.yml -l prod
# ============================================================

all:
  children:

    vpn_servers:
      children:
        test:
          hosts:
            xray-test:
              ansible_host: 127.0.0.1     # или IP вашего контейнера
              ansible_port: 2222            # SSH порт контейнера
              ansible_user: root
              ansible_ssh_pass: root       # или ansible_ssh_private_key_file
              # Для контейнера без systemd — смотри примечание в README
              ansible_python_interpreter: /usr/bin/python3
              xray_tunnel_enabled: false

        #prod:
        #  hosts:
        #    xray-prod:
        #      ansible_host: YOUR_SERVER_IP
        #      ansible_port: 22
        #      ansible_user: root
        #      ansible_ssh_private_key_file: ~/.ssh/id_ed25519
        #      ansible_python_interpreter: /usr/bin/python3

  vars:
    # Глобальные переменные для всех серверов
    # Переопределяют defaults/main.yml
    xray_port: 443
    xray_reality_dest: "www.microsoft.com:443"
    xray_reality_server_name: "www.microsoft.com"
    xray_fingerprint: "chrome"
    xray_log_level: "warning"
    xray_bbr_enabled: true
    xray_autoupdate_enabled: true

    # Список клиентов
    # UUID оставь пустым — сгенерируется автоматически и сохранится на сервере
    xray_clients:
      - name: "alice"
        uuid: ""
        flow: "xtls-rprx-vision"
        email: "alice@vpn"
      - name: "bob"
        uuid: ""
        flow: "xtls-rprx-vision"
        email: "bob@vpn"
